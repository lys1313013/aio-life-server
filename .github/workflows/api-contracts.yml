name: Synchronize API contracts

on:
  push:
    branches: [main]
    paths:
      - src/main/java/**/*.java
      - .github/workflows/api-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronize:
    uses: lys1313013/aio-life/.github/workflows/api-contracts.yml@main
    secrets:
      CONTRACTS_FRONT_SSH_KEY: ${{ secrets.CONTRACTS_FRONT_SSH_KEY }}
      CONTRACTS_MOBILE_SSH_KEY: ${{ secrets.CONTRACTS_MOBILE_SSH_KEY }}
