name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  database-schema:
    name: Verify current database schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: schema_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pschema_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check current initialization and isolation guards
        run: python3 scripts/test-database-schema.py
      - name: Initialize current schema and verify constraints
        env:
          MYSQL_PWD: schema_test_password
        run: python3 scripts/check-database-schema.py verify
      - name: Upload release schema contract and initialization evidence
        uses: actions/upload-artifact@v6
        with:
          name: database-schema-${{ github.sha }}
          path: artifacts/database-schema/*.json
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AIO_LIFE_DB_URL: 127.0.0.1:3306
      AIO_LIFE_DB_PASSWORD: test_password
      AIO_LIFE_REDIS_HOST: 127.0.0.1
      AIO_LIFE_REDIS_PORT: 6379
      AIO_LIFE_NEO4J_ENABLED: 'false'
      AIO_LIFE_SCHEDULING_ENABLED: 'false'
      AIO_LIFE_CBTI_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aio_life
          MYSQL_USER: aio_life
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize test database
        env:
          MYSQL_PWD: root_password
        run: |
          set -euo pipefail

          mysql_args=(--host=127.0.0.1 --port=3306 --user=root --database=aio_life --default-character-set=utf8mb4)

          # 与结构验证器共用全量基线、未合并增量和种子的执行顺序。
          python3 scripts/check-database-schema.py files > "$RUNNER_TEMP/aio-schema-initialization.txt"
          while IFS= read -r sql_file; do
            mysql "${mysql_args[@]}" < "$sql_file"
          done < "$RUNNER_TEMP/aio-schema-initialization.txt"

      - name: Test and package
        run: mvn package -B -ntp

      - name: Upload application JAR
        uses: actions/upload-artifact@v6
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    if: github.event_name != 'pull_request'
    needs: [test, database-schema]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download tested application JAR
        uses: actions/download-artifact@v6
        with:
          name: application-jar
          path: ${{ runner.temp }}/server-image

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          jars=("$RUNNER_TEMP/server-image/"*.jar)
          test "${#jars[@]}" -eq 1
          mv "${jars[0]}" "$RUNNER_TEMP/server-image/app.jar"
          cp Dockerfile.runtime "$RUNNER_TEMP/server-image/Dockerfile"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=aio-life-server
            org.opencontainers.image.description=AIO Life Service Backend (Spring Boot 3 / Java 21)
            org.opencontainers.image.vendor=lys1313013

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/server-image
          file: ${{ runner.temp }}/server-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # 关闭 attestation，避免阿里云 ACR 拒绝 application/vnd.oci.empty.v1+json 类型的 manifest
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/aio-life-server:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/aio-life-server:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-runtime
          cache-to: type=gha,scope=server-runtime,mode=min
