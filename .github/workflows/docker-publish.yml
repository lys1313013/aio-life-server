name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flyway-migrations:
    name: Verify Flyway on MySQL 8.0 and 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify migration guards, data preservation and recovery
        run: mvn -B -ntp -f tools/flyway/pom.xml verify
      - name: Upload schema contracts and JUnit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flyway-migrations-${{ github.sha }}
          path: |
            tools/flyway/target/schema/
            tools/flyway/target/surefire-reports/
            tools/flyway/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.40', '8.4.2']
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AIO_LIFE_DB_URL: 127.0.0.1:3306
      AIO_LIFE_DB_PASSWORD: test_password
      AIO_LIFE_REDIS_HOST: 127.0.0.1
      AIO_LIFE_REDIS_PORT: 6379
      AIO_LIFE_NEO4J_ENABLED: 'false'
      AIO_LIFE_SCHEDULING_ENABLED: 'false'
      AIO_LIFE_CBTI_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: test
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: aio_life
          MYSQL_USER: aio_life
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize test database
        env:
          FLYWAY_URL: 'jdbc:mariadb://127.0.0.1:3306/aio_life?sslMode=disable&allowPublicKeyRetrieval=true'
          FLYWAY_USER: root
          FLYWAY_PASSWORD: root_password
        run: |
          # 在空的 CI 测试库中先设置项目字符集，与隔离迁移测试的建库方式一致。
          docker exec -e MYSQL_PWD=root_password "${{ job.services.mysql.id }}" \
            mysql -uroot -e 'ALTER DATABASE aio_life CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mvn -B -ntp -f tools/flyway/pom.xml compile flyway:migrate flyway:validate

      - name: Test and package
        run: mvn package -B -ntp

      - name: Upload application JAR
        if: matrix.mysql == '8.0.40'
        uses: actions/upload-artifact@v6
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-mysql-${{ matrix.mysql }}-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    if: github.event_name != 'pull_request'
    needs: [test, flyway-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download tested application JAR
        uses: actions/download-artifact@v6
        with:
          name: application-jar
          path: ${{ runner.temp }}/server-image

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          jars=("$RUNNER_TEMP/server-image/"*.jar)
          test "${#jars[@]}" -eq 1
          mv "${jars[0]}" "$RUNNER_TEMP/server-image/app.jar"
          cp Dockerfile.runtime "$RUNNER_TEMP/server-image/Dockerfile"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=aio-life-server
            org.opencontainers.image.description=AIO Life Service Backend (Spring Boot 3 / Java 21)
            org.opencontainers.image.vendor=lys1313013

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/server-image
          file: ${{ runner.temp }}/server-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # 关闭 attestation，避免阿里云 ACR 拒绝 application/vnd.oci.empty.v1+json 类型的 manifest
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/aio-life-server:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/aio-life-server:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-runtime
          cache-to: type=gha,scope=server-runtime,mode=min
