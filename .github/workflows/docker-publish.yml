name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}

jobs:
  flyway-migrations:
    name: Verify Flyway on PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify migration guards, data preservation and recovery
        run: mvn -B -ntp -f tools/flyway/pom.xml verify
      - name: Upload schema contracts and JUnit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flyway-migrations-${{ github.sha }}
          path: |
            tools/flyway/target/schema/
            tools/flyway/target/surefire-reports/
            tools/flyway/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test (PostgreSQL ${{ matrix.postgresql }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql: '18-alpine'
            shard: record-api
            tests: 'top.aiolife.record.api.**,top.aiolife.scheduling.**,top.aiolife.export.**'
            package: 'true'
          - postgresql: '18-alpine'
            shard: record-rest
            tests: 'top.aiolife.record.service.**,top.aiolife.record.mcp.**,top.aiolife.record.client.**,top.aiolife.record.notification.**,top.aiolife.record.provider.**,top.aiolife.record.weread.**,top.aiolife.record.filter.**,top.aiolife.record.prediction.**,top.aiolife.record.mapper.**,top.aiolife.record.pojo.**,top.aiolife.record.util.**,top.aiolife.record.enums.**,top.aiolife.record.convertor.**,top.aiolife.system.**,top.aiolife.core.**,top.aiolife.database.**,top.aiolife.bankcard.**,top.aiolife.support.**,top.aiolife.docs.**,top.aiolife.capture.**,top.aiolife.relationship.**,top.aiolife.mcp.**,top.aiolife.wardrobe.**,top.aiolife.membership.**'
            package: 'false'
          - postgresql: '18-alpine'
            shard: sso-config
            tests: 'top.aiolife.sso.**,top.aiolife.config.**,top.aiolife.security.**'
            package: 'false'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AIO_LIFE_DB_URL: 127.0.0.1:5432
      AIO_LIFE_DB_PASSWORD: test_password
      AIO_LIFE_REDIS_HOST: 127.0.0.1
      AIO_LIFE_REDIS_PORT: 6379
      AIO_LIFE_NEO4J_ENABLED: 'false'
      AIO_LIFE_SCHEDULING_ENABLED: 'false'
      AIO_LIFE_CBTI_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: test
    services:
      postgresql:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: aio_life
          POSTGRES_USER: aio_life
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aio_life -d aio_life"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize test database
        env:
          FLYWAY_URL: 'jdbc:postgresql://127.0.0.1:5432/aio_life'
          FLYWAY_USER: aio_life
          FLYWAY_PASSWORD: test_password
        run: |
          mvn -B -ntp -f tools/flyway/pom.xml compile flyway:migrate flyway:validate

      - name: Test and package
        if: matrix.package == 'true'
        run: mvn package -B -ntp -Dtest='${{ matrix.tests }}' -Dtest.excludedGroups=external,integration

      - name: Test
        if: matrix.package != 'true'
        run: mvn test -B -ntp -Dtest='${{ matrix.tests }}' -Dtest.excludedGroups=external,integration

      - name: Upload application JAR
        if: matrix.package == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-postgresql-${{ matrix.postgresql }}-${{ matrix.shard }}-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  integration-test:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AIO_LIFE_NEO4J_ENABLED: 'false'
      AIO_LIFE_SCHEDULING_ENABLED: 'false'
      AIO_LIFE_CBTI_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: mvn test -B -ntp -Dgroups=integration -Dtest.excludedGroups=external

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-integration-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    if: github.event_name != 'pull_request'
    needs: [test, integration-test, flyway-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download tested application JAR
        uses: actions/download-artifact@v7
        with:
          name: application-jar
          path: ${{ runner.temp }}/server-image

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          jars=("$RUNNER_TEMP/server-image/"*.jar)
          test "${#jars[@]}" -eq 1
          mv "${jars[0]}" "$RUNNER_TEMP/server-image/app.jar"
          cp Dockerfile.runtime "$RUNNER_TEMP/server-image/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/aio-life-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=aio-life-server
            org.opencontainers.image.description=AIO Life Service Backend (Spring Boot 3 / Java 21)
            org.opencontainers.image.vendor=lys1313013

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/server-image
          file: ${{ runner.temp }}/server-image/Dockerfile
          push: true
          platforms: linux/amd64
          # 关闭 attestation，避免阿里云 ACR 拒绝 application/vnd.oci.empty.v1+json 类型的 manifest
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/aio-life-server:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-runtime
          cache-to: type=gha,scope=server-runtime,mode=min
